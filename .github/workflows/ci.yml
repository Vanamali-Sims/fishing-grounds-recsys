name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install serving deps
        run: pip install -r requirements-serve.txt
      - name: Unit tests that do not need gold or GDAL
        run: python -m unittest tests.test_season tests.test_api_stub -v
